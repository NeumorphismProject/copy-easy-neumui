  <script>
    // const animation = bodymovin.loadAnimation({
    //   container: document.getElementById('lottie'), // Required
    //   path: './lottie-animation/thinking.json', // Required
    //   renderer: 'svg', // 'svg/canvas/html', // Required
    //   loop: true, // Optional
    //   autoplay: true, // Optional
    //   name: "", // Name for future reference. Optional.
    // })

    $(document).ready(function () {
      const askInput = $('#ask-input').data('askInput');
      const editorSendBtn = $('#editor-send-btn')
      const askListDom = $('#ask-content')

      function setAskListDomScrollToBottom() {
        document.querySelector('#ask-content').scrollTo({
          top: askListDom[0].scrollHeight,
          behavior: 'smooth',
        })
        // askListDom.animate({
        //   scrollTop: askListDom[0].scrollHeight
        // }, {
        //   duration: 300,
        //   easing: 'swing'  // 缓动效果：swing 或 linear
        // });
      }

      // setTimeout(() => { setAskListDomScrollToBottom() }, 3000)

      // 'idle'=闲置； 'processing'=任务中；
      const askStatusProxyTarget = { value: 'idle' }
      const askStatusProxy = new Proxy(askStatusProxyTarget, {
        get(target, property, receiver) {
          return target.value
        },
        set(target, property, value, receiver) {
          editorSendBtn.removeClass('processing-btn')
          if (value === 'processing') {
            editorSendBtn.addClass('processing-btn')
          }
          target.value = value
        }
      })

      let autoScrollBottomSwitch = false
      askListDom.on('scroll', function (event) {
        console.log('scroll event = ', event)
        if (askStatusProxy.value !== 'processing') {
          return
        }

        // 仅流式请求进行中才有效
        const { scrollHeight, scrollTop, clientHeight } = event.target
        const distanceBottom = scrollHeight - scrollTop - clientHeight
        console.log('--- distanceBottom = ', distanceBottom)

        const entryDistace = 60
        const leaveDistacne = 20
        if (distanceBottom > leaveDistacne) {
          // (高优先级) 离开有效区，关闭自动定位到底部
          autoScrollBottomSwitch = false
          return
        }
        if (distanceBottom < entryDistace) {
          // 进入有效区，开启自动滚动定位到底部
          autoScrollBottomSwitch = true
        }
      })


      let askList = [
        // {
        //   unikey: 'r_1',
        //   role: 'question',
        //   content: ''
        // },
        // {
        //   unikey: 'l_2',
        //   role: 'answer',
        //   status: 'loading', // 'loading' | 'printing' | 'done'
        //   content: ''
        // }
      ]
      const askListProxyTarget = { value: askList }
      const askListProxy = new Proxy(askListProxyTarget, {
        get(target, property, receiver) {
          return target.value
        },
        set(target, property, value, receiver) {
          const _htmlStr = value.map((d) => {
            let domFormat = ''
            if (d.role === 'question') {
              domFormat = `
              <div class="question-box">
                <div id="${d.unikey}" class="question">${d.content}</div>
              </div>
              `
            } else if (d.role === 'answer') {
              if (d.status === 'loading') {
                domFormat = `
                <div class="answer-box">
                  <div class="answer">
                    <div id="loading_${d.unikey}" class="loading">
                      <div id="lottie" class="lottie"></div>
                      <div class="lottie-text">Thinking...</div>
                    </div>
                  </div>
                </div>
                `
              } else {
                domFormat = `
                <div class="answer-box">
                  <div class="avatar">
                    <svg t="1752214660773" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="13628" width="100%" height="100%"><path d="M341.333333 275.083947s82.35008-106.5984 130.198187-104.383147c47.85152 2.218667 34.341547 150.637227 21.701973 166.37952-12.63616 15.742293-64.785067 33.447253-64.785066 33.447253s39.796053 16.104107 39.796053 50.858667-35.375787 73.977173-77.800107 30.378667c-42.427733-43.598507-45.305173-86.736213-45.305173-86.736214M341.333333 275.083947S258.983253 168.485547 211.135147 170.7008c-47.85152 2.218667-34.341547 150.637227-21.701974 166.37952 12.63616 15.742293 64.785067 33.447253 64.785067 33.447253s-39.796053 16.104107-39.796053 50.858667 35.375787 73.977173 77.800106 30.378667c42.427733-43.598507 45.305173-86.736213 45.305174-86.736214" fill="#26BBEC" p-id="13629"></path><path d="M341.333333 238.933333m-13.653333 0a13.653333 13.653333 0 1 0 27.306667 0 13.653333 13.653333 0 1 0-27.306667 0Z" fill="#26BBEC" p-id="13630"></path><path d="M327.68 314.026667a75.093333 13.653333 90 1 0 27.306667 0 75.093333 13.653333 90 1 0-27.306667 0Z" fill="#26BBEC" p-id="13631"></path><path d="M750.933333 493.53728s82.35008-106.5984 130.198187-104.383147c47.85152 2.218667 34.341547 150.637227 21.701973 166.37952-12.63616 15.742293-64.785067 33.447253-64.785066 33.447254s39.796053 16.104107 39.796053 50.858666-35.375787 73.977173-77.800107 30.378667c-42.427733-43.598507-45.305173-86.736213-45.305173-86.736213M750.933333 493.53728s-82.35008-106.5984-130.198186-104.383147c-47.85152 2.218667-34.341547 150.637227-21.701974 166.37952 12.63616 15.742293 64.785067 33.447253 64.785067 33.447254s-39.796053 16.104107-39.796053 50.858666 35.375787 73.977173 77.800106 30.378667c42.427733-43.598507 45.305173-86.736213 45.305174-86.736213" fill="#ED5481" p-id="13632"></path><path d="M750.933333 457.386667m-13.653333 0a13.653333 13.653333 0 1 0 27.306667 0 13.653333 13.653333 0 1 0-27.306667 0Z" fill="#26BBEC" p-id="13633"></path><path d="M737.28 532.48a75.093333 13.653333 90 1 0 27.306667 0 75.093333 13.653333 90 1 0-27.306667 0Z" fill="#26BBEC" p-id="13634"></path><path d="M300.373333 684.683947s82.35008-106.5984 130.198187-104.383147c47.85152 2.218667 34.341547 150.637227 21.701973 166.37952-12.63616 15.742293-64.785067 33.447253-64.785066 33.447253s39.796053 16.104107 39.796053 50.858667-35.375787 73.977173-77.800107 30.378667c-42.427733-43.598507-45.305173-86.736213-45.305173-86.736214M300.373333 684.683947s-82.35008-106.5984-130.198186-104.383147c-47.85152 2.218667-34.341547 150.637227-21.701974 166.37952 12.63616 15.742293 64.785067 33.447253 64.785067 33.447253s-39.796053 16.104107-39.796053 50.858667 35.375787 73.977173 77.800106 30.378667c42.427733-43.598507 45.305173-86.736213 45.305174-86.736214" fill="#FBAD4A" p-id="13635"></path><path d="M300.373333 648.533333m-13.653333 0a13.653333 13.653333 0 1 0 27.306667 0 13.653333 13.653333 0 1 0-27.306667 0Z" fill="#26BBEC" p-id="13636"></path><path d="M286.72 723.626667a75.093333 13.653333 90 1 0 27.306667 0 75.093333 13.653333 90 1 0-27.306667 0Z" fill="#26BBEC" p-id="13637"></path></svg>
                  </div>
                  <div class="answer">
                    <github-md id="${d.unikey}">${d.content}${d.status !== 'done' ? '<span class="cursor"></span>' : ''}</github-md>
                  </div>
                </div>
                `
              }

            }
            return domFormat
          }).filter((s) => !!s).join('')
          // console.log('------ _htmlStr = ', _htmlStr)
          askListDom.html(_htmlStr)

          // -- loading animation
          const animation = bodymovin.loadAnimation({
            container: document.getElementById('lottie'), // Required
            path: './lottie-animation/thinking.json', // Required
            renderer: 'svg', // 'svg/canvas/html', // Required
            loop: true, // Optional
            autoplay: true, // Optional
            name: "", // Name for future reference. Optional.
          })

          target.value = value
        }
      })

      function updateSendBtnStatus(pInput) {
        const _val = pInput === undefined ? $('#ask-input').html() : pInput
        if (!_val) {
          editorSendBtn.attr('disabled', 'true')
        } else {
          editorSendBtn.removeAttr('disabled')
        }
      }

      function askDone(isAbort=false) {
        const _list = askListProxy.value
        _list[_list.length - 1] = {
          ..._list[_list.length - 1],
          status: 'done', // 'loading' | 'printing' | 'done'
        }
        if (isAbort && !_list[_list.length - 1].content) {
          _list[_list.length - 1].content = '消息已中断！'
        } else if (isAbort && !!_list[_list.length - 1].content) {
          _list[_list.length - 1].content = _list[_list.length - 1].content + '消息被中断！'
        }
        askListProxy.value = _list
        askStatusProxy.value = 'idle'
        updateSendBtnStatus()
      }

      function sendAsk(value) {
        autoScrollBottomSwitch = true;
        askStatusProxy.value = 'processing';
        const _list = askListProxy.value
        _list.push({
          unikey: 'r_' + _list.length + 1,
          role: 'question',
          content: value
        },
          {
            unikey: 'l_' + _list.length + 1,
            role: 'answer',
            status: 'loading', // 'loading' | 'printing' | 'done'
            content: ''
          })
        askListProxy.value = _list;

        // -- api request
        $.apiPostAsk({
          content: value,
          onMessage: function (message) {
            console.log('ai response = ', message)
            _list[_list.length - 1] = {
              ..._list[_list.length - 1],
              status: 'printing', // 'loading' | 'printing' | 'done'
              content: message === undefined ? '接口请求异常，没收到消息，请重试！' : _list[_list.length - 1].content + message
            }
            // -- 
            askListProxy.value = _list

            if (autoScrollBottomSwitch) {
              setAskListDomScrollToBottom();
            }
          },
          onError: function (error) {

          },
          onDone: askDone
        });
      }

      $('#ask-input').askInput({
        placeholder: '想问什么、聊什么都可以哦~',
        autoFocus: true,
        initialValue: '',
        onTextChange: updateSendBtnStatus,
        onEnter: sendAsk,
        onBackspace: function (value) {
          console.log('Backspace pressed:', value);
        }
      });

      // Example usage of public methods
      // const askInput = $('#ask-input').data('askInput');
      // askInput.focus();
      // askInput.updateValue('New @content');
      // console.log(askInput.getValue());

      editorSendBtn.on('click', function () {
        if (askStatusProxy.value === 'processing') {
          $.apiPostAsk.abortRequest();
          askDone(true);
        } else { // askStatusProxy.value === idle
          sendAsk($('#ask-input').html());
          $('#ask-input').html('');
        }
      })
    });
  </script>
